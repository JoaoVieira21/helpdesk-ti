<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HelpDesk TI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topo">
        <div>
            <h1>HelpDesk TI</h1>
            <p>Sistema de gerenciamento de chamados</p>
        </div>
    </header>

    <main class="container">

        <!-- RESUMO -->
        <section class="resumo">

            <div class="resumo-card">
                <span class="resumo-titulo">Total de chamados</span>
                <strong id="total-chamados">0</strong>
            </div>

            <div class="resumo-card">
                <span class="resumo-titulo">Abertos</span>
                <strong id="chamados-abertos">0</strong>
            </div>

            <div class="resumo-card">
                <span class="resumo-titulo">Em atendimento</span>
                <strong id="chamados-atendimento">0</strong>
            </div>

            <div class="resumo-card">
                <span class="resumo-titulo">Resolvidos</span>
                <strong id="chamados-resolvidos">0</strong>
            </div>

        </section>


        <!-- NOVO CHAMADO -->
        <section class="card">

            <div class="card-titulo">
                <div>
                    <h2>Novo chamado</h2>
                    <p>Abra um novo chamado para a equipe de suporte.</p>
                </div>
            </div>

            <form id="form-chamado">

                <div class="campo">
                    <label for="titulo">Título</label>
                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex.: Computador não liga"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <textarea
                        id="descricao"
                        placeholder="Descreva o problema encontrado..."
                        required
                    ></textarea>
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>

                    <select id="prioridade">
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>

                <button type="submit">
                    Abrir chamado
                </button>

            </form>

        </section>


        <!-- CHAMADOS -->
        <section class="card">

            <div class="card-titulo">
                <div>
                    <h2>Chamados de suporte</h2>
                    <p>Acompanhe os chamados registrados no sistema.</p>
                </div>
            </div>

            <div id="lista-chamados">
                Carregando chamados...
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
